name: Build iOS IPA
# ============================================================
# ⚠️ 本 workflow 严格遵循 kivy-ios 官方 CI 配置
#    参考: https://github.com/kivy/kivy-ios/blob/master/.github/workflows/kivy_ios.yml
#    参考: https://github.com/kivy/kivy-ios/blob/master/.ci/test_project.sh
# ============================================================

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支/tag/commit(默认当前分支)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ====================== 1. Checkout ======================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # ====================== 2. Xcode ======================
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sudo xcodebuild -license accept
          xcodebuild -version

      # ====================== 3. Python ======================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ====================== 4. 依赖 (严格按 kivy-ios 官方 CI) ======================
      - name: Install Homebrew dependencies
        run: |
          brew install libjpeg
          brew install autoconf automake libtool pkg-config
          brew link libtool

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          # ⚠️ Cython 版本必须锁定为 0.29.36 (kivy-ios 官方要求)
          pip install Cython==0.29.36
          pip install kivy-ios kivy

      # ====================== 5. 编译 Python + Kivy toolchain ======================
      - name: Build Python3 & Kivy for iOS (首次约 30-50 分钟)
        run: |
          set -e
          # 缓存目录在项目外,避免被 rsync 同步进 app
          CACHE_DIR="$HOME/kivyios-dist"
          if [ -d "$CACHE_DIR" ]; then
            echo "[CACHE] 找到已缓存的 kivy-ios toolchain"
            # 重新软链接 dist -> 缓存
            rm -rf dist
            ln -s "$CACHE_DIR" dist
            ls -la dist
          else
            echo "[BUILD] 首次构建,运行 toolchain build python3 kivy"
            toolchain build python3 kivy
            # 构建完成后搬到缓存目录
            mv dist "$CACHE_DIR"
            ln -s "$CACHE_DIR" dist
            echo "[BUILD] 构建完成,产物已缓存"
            du -sh "$CACHE_DIR"
          fi
          echo "--- dist 状态 ---"
          ls -la dist

      # ====================== 5.5 删除 CPython 测试套件(compileall 会在带非 UTF-8 字节的测试文件上失败) ======================
      # 根因: toolchain build python3 会把整个 CPython Lib/ 打包进 dist,包括 Lib/test/
      # 其中 tokenizedata/*.py 故意包含非 UTF-8 字节(如 0xf6),compileall 编译时报 SyntaxError
      # iOS 运行时不需要测试套件,直接删除即可
      - name: Remove CPython test suite from dist
        run: |
          echo "[FIX] 删除 dist 里的 Lib/test 目录(compileall 会故意在这些文件上失败)"
          echo "--- 删除前 dist 里的 Lib/test ---"
          find dist -type d -name "test" -path "*/Lib/*" -print || echo "无 Lib/test 目录"
          echo "--- 执行删除 ---"
          find dist -type d -path "*/Lib/test" -prune -exec rm -rf {} + 2>/dev/null || true
          find dist -type f -path "*/Lib/test/tokenizedata/*.py" -delete 2>/dev/null || true
          echo "--- 删除后验证 ---"
          find dist -type d -name "test" -path "*/Lib/*" -print || echo "[OK] Lib/test 已清除"
          ls -la dist/ 2>/dev/null | head -10

      - name: Save toolchain cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'macOS' && format('{0}/kivyios-dist', env.HOME) || 'dist' }}
          key: macos-kivyios-dist-${{ hashFiles('buildozer.spec') }}-v5
          restore-keys: |
            macos-kivyios-dist-

      # ====================== 6. 字体检查 ======================
      - name: Verify font file exists
        run: |
          if [ ! -f chinese.ttf ]; then
            echo "::error::chinese.ttf 未找到,请先放入项目根目录"
            exit 1
          fi
          ls -lh chinese.ttf

      # ====================== 7. 创建 Xcode 项目 ======================
      # ⚠️ 关键: 项目名设为 sudoku_app(与仓库名 sudoku-ios 不同,避免 rsync 递归嵌套)
      # ⚠️ 关键: 使用绝对路径(符合 kivy-ios 官方文档要求)
      - name: Create Xcode project
        run: |
          APP_NAME="sudoku_app"
          WORK_DIR="$(pwd)"
          echo "应用目录: $WORK_DIR"
          toolchain create "$APP_NAME" "$WORK_DIR"
          echo ""
          echo "--- 生成的文件结构 ---"
          ls -la "${APP_NAME}-ios/"
          echo ""
          echo "--- YourApp 模板内容(将被清空) ---"
          find "${APP_NAME}-ios/YourApp" -maxdepth 3 2>/dev/null || echo "YourApp 目录不存在"

      # ====================== 8. 清空 YourApp 模板占位文件 ======================
      # toolchain create 会生成 YourApp/ 模板目录,里面有 README.txt/android.txt/
      # pictures.kv/shadow32.png 等占位文件。Run Script 里的 rsync 在同步源码时
      # 会遇到这些"不属于你的项目"的文件,触发 code 24 (file has vanished)。
      # 解法: 清空模板文件但保留 YourApp/ 目录本身,让 rsync 从干净状态开始。
      - name: Clean YourApp template files
        run: |
          APP_NAME="sudoku_app"
          YOUR_APP_DIR="${APP_NAME}-ios/YourApp"
          if [ -d "$YOUR_APP_DIR" ]; then
            echo "[FIX] 清空 $YOUR_APP_DIR 里的模板占位文件"
            find "$YOUR_APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            echo "[FIX] 清空完成"
            ls -la "$YOUR_APP_DIR"
          else
            echo "[INFO] $YOUR_APP_DIR 不存在,跳过"
          fi

      # ====================== 9. 列出 schemes ======================
      - name: List available schemes
        run: |
          APP_NAME="sudoku_app"
          cd "${APP_NAME}-ios"
          xcodebuild -project "${APP_NAME}.xcodeproj" -list
          cd ..

      # ====================== 10. 构建 (严格按 kivy-ios 官方 CI 格式) ======================
      # 命令格式参考:
      #   xcodebuild -project <name>-ios/<name>.xcodeproj \
      #              -scheme <name> \
      #              -destination generic/platform=iOS \
      #              clean build CODE_SIGNING_ALLOWED=NO
      # 额外参数:
      #   - ENABLE_USER_SCRIPT_SANDBOXING=NO (Xcode 14+ 默认沙箱会阻止 Run Script)
      #   - IPHONEOS_DEPLOYMENT_TARGET=14.0  (对齐 buildozer.spec)
      # ====================== 10. Patch pbxproj —— 让 Run Script 里的 compileall 容忍错误 ======================
      # kivy-ios 生成的 Run Script 会对 dist/ 下所有 .py 执行 python3 -m compileall
      # 即使已经删了 Lib/test,仍有极少量边缘文件可能触发 SyntaxError
      # 最稳妥的做法:给 compileall 命令加 || true,让脚本不因编译警告退出
      - name: Patch Run Script — compileall 忽略错误
        run: |
          APP_NAME="sudoku_app"
          PBXPROJ="${APP_NAME}-ios/${APP_NAME}.xcodeproj/project.pbxproj"
          if [ ! -f "$PBXPROJ" ]; then
            echo "::error::找不到 $PBXPROJ"
            exit 1
          fi
          echo "[FIX] Patch $PBXPROJ 里的 compileall 命令"
          # 先备份
          cp "$PBXPROJ" "${PBXPROJ}.bak"

          # 查看 patch 前的 compileall 行
          echo "--- patch 前 compileall 行 ---"
          grep -n "compileall" "$PBXPROJ" || echo "未找到 compileall 关键字"

          # 在所有 python3 -m compileall ... 行末尾追加 || true (如果还没有的话)
          # pbxproj 里 Run Script 是转义后的多行文本(带 \n),所以用 perl 处理
          perl -i -pe 's|(python3?\s+-m\s+compileall[^;\n]*)(?<!\|\|\s*true)(?=\s*\\?n|\s*;|\s*$)|$1 || true|g' "$PBXPROJ"

          echo "--- patch 后 compileall 行 ---"
          grep -n "compileall" "$PBXPROJ" || echo "未找到"

          # 验证 pbxproj 文件未损坏(至少应能被 plutil 解析)
          echo "--- pbxproj 大小 ---"
          wc -c "$PBXPROJ"

      - name: Build .app (Release, arm64 for iOS)
        id: build
        run: |
          set -eo pipefail
          APP_NAME="sudoku_app"
          cd "${APP_NAME}-ios"

          # 运行前再清空一次 YourApp,确保干净状态
          if [ -d "YourApp" ]; then
            find YourApp -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

          # 再次确认 dist 里没有 Lib/test (双重保险)
          find ../dist -type d -path "*/Lib/test" -prune -exec rm -rf {} + 2>/dev/null || true

          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -destination generic/platform=iOS \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee build.log

          echo "--- Build exit code: ${PIPESTATUS[0]} ---"
          cd ..

      # ====================== 11. 定位 .app 产物 ======================
      - name: Locate .app bundle
        id: locate
        run: |
          APP_NAME="sudoku_app"
          # 1) 从 xcodebuild 构建设置获取产物目录
          cd "${APP_NAME}-ios"
          BUILT_DIR=$(xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -destination generic/platform=iOS \
            -showBuildSettings 2>/dev/null | \
            awk '/ BUILT_PRODUCTS_DIR/{print $3; exit}')
          cd ..

          APP_PATH=""
          if [ -n "$BUILT_DIR" ] && [ -d "$BUILT_DIR/${APP_NAME}.app" ]; then
            APP_PATH="$BUILT_DIR/${APP_NAME}.app"
            echo "[OK] 从 BUILT_PRODUCTS_DIR 定位到: $APP_PATH"
          fi

          # 2) 兜底: 搜索 DerivedData
          if [ -z "$APP_PATH" ]; then
            echo "[WARN] 构建设置未返回,搜索 DerivedData..."
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
              -name "${APP_NAME}.app" -type d -maxdepth 10 2>/dev/null | head -1)
          fi

          # 3) 最后兜底: 搜索项目目录
          if [ -z "$APP_PATH" ]; then
            echo "[WARN] DerivedData 也未找到,搜索项目目录..."
            APP_PATH=$(find "${APP_NAME}-ios" \
              -name "${APP_NAME}.app" -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 ${APP_NAME}.app,请下载 build-log artifact 查看"
            exit 1
          fi

          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "[OK] 最终定位到: $APP_PATH"
          ls -la "$APP_PATH"

      # ====================== 12. 打包 IPA ======================
      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          APP_NAME="sudoku_app"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          cd "$STAGE"
          # -0 = store (不压缩),iOS 对 IPA 压缩有限制
          zip -qry "${{ github.workspace }}/${APP_NAME}-unsigned.ipa" Payload
          cd "${{ github.workspace }}"
          ls -lh "${APP_NAME}-unsigned.ipa"

      # ====================== 13. 上传产物 ======================
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-unsigned-ipa
          path: sudoku_app-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: sudoku_app-ios/build.log
          retention-days: 7
          if-no-files-found: ignore
