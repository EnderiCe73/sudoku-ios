name: Build iOS IPA

# 触发条件:
#   1. 手动触发(在 GitHub 仓库 Actions 页面点 "Run workflow")
#   2. 推送 v* 开头的 tag 时自动触发(如 v1.0, v1.1-beta)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支/tag/commit(默认当前分支)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14   # Apple Silicon (M1),原生编译 iOS arm64 最快
    timeout-minutes: 90  # 首次构建约 40-60 分钟,留足余量

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          sudo xcodebuild -license accept
          xcodebuild -version

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Homebrew dependencies
        run: |
          brew install pkg-config autoconf automake libtool cmake

      - name: Install Cython, kivy-ios and kivy
        run: |
          python -m pip install --upgrade pip
          # 必须先装 cython,kivy-ios 编译 Kivy 时需要它生成 C 扩展
          pip install cython
          pip install kivy-ios kivy

      - name: Cache kivy-ios build output
        id: cache-dist
        uses: actions/cache@v4
        with:
          # 缓存放 ~/kivyios-dist(绝对路径),项目里的 dist 会改成指向它的软链接
          path: ${{ runner.os == 'macOS' && format('{0}/kivyios-dist', env.HOME) || 'dist' }}
          key: ${{ runner.os }}-kivyios-dist-${{ hashFiles('buildozer.spec') }}-v4
          restore-keys: |
            ${{ runner.os }}-kivyios-dist-

      - name: Build Python3 & Kivy for iOS (首次约 30-50 分钟)
        run: |
          # 缓存命中时直接跳过;否则编译 dist/
          if [ -d "$HOME/kivyios-dist" ] && [ ! -e dist ]; then
            # 缓存命中但 dist 软链接还没建(上一次运行被中断的情况)
            ln -s "$HOME/kivyios-dist" dist
            echo "[CACHE] 已恢复 dist 软链接"
          elif [ -d "$HOME/kivyios-dist" ] && [ -L dist ]; then
            echo "[CACHE] 软链接已存在,跳过 toolchain build"
          elif [ -d dist ] && [ ! -L dist ]; then
            echo "[BUILD] 命中缓存但 dist 是物理目录,改造成软链接..."
            mv dist "$HOME/kivyios-dist"
            ln -s "$HOME/kivyios-dist" dist
          else
            echo "[BUILD] 未命中缓存,运行 toolchain build python3 kivy"
            toolchain build python3 kivy
            # 构建完成后立即搬到项目外,rsync 不跟随 symlink 就不会拷 2GB
            rm -rf "$HOME/kivyios-dist"
            mv dist "$HOME/kivyios-dist"
            ln -s "$HOME/kivyios-dist" dist
          fi
          echo "--- dist 状态 ---"
          ls -la dist
          du -sh "$HOME/kivyios-dist" 2>/dev/null || true

      - name: Verify font file exists
        run: |
          if [ ! -f chinese.ttf ]; then
            echo "::error::chinese.ttf 未找到,请先放入项目根目录"
            exit 1
          fi
          ls -lh chinese.ttf

      - name: Create Xcode project
        run: |
          # toolchain create <name> <project-dir>
          toolchain create sudoku .
          ls -la sudoku-ios/
          # 打印 rsync 命令格式(排查用)
          echo "--- rsync in pbxproj ---"
          grep -n "rsync" sudoku-ios/sudoku.xcodeproj/project.pbxproj | head -5 || true

      - name: List available schemes
        run: |
          cd sudoku-ios
          xcodebuild -project sudoku.xcodeproj -list || true

      - name: Build unsigned .app (Release, arm64)
        run: |
          cd sudoku-ios
          # 产物保留在默认 DerivedData(kivy-ios 的 Run Script 会 rsync 源码目录,
          # 若把产物放进项目树会递归同步自身导致 rsync code 24 失败)
          # set -o pipefail 确保 xcodebuild 失败时能正确报错(tee 不会吞掉退出码)
          set -o pipefail
          xcodebuild \
            -project sudoku.xcodeproj \
            -scheme sudoku \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee build.log

          echo "---"
          echo "Product dir from build settings:"
          xcodebuild -project sudoku.xcodeproj -scheme sudoku -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null | grep -E "BUILT_PRODUCTS_DIR|TARGET_BUILD_DIR" || true

      - name: Locate .app bundle
        id: locate
        run: |
          # 1) 从 xcodebuild 构建设置直接获取产物目录(最可靠)
          BUILT_DIR=$(cd sudoku-ios && xcodebuild -project sudoku.xcodeproj -scheme sudoku -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null | awk '/ BUILT_PRODUCTS_DIR/{print $3; exit}')
          APP_PATH=""
          if [ -n "$BUILT_DIR" ] && [ -d "$BUILT_DIR/sudoku.app" ]; then
            APP_PATH="$BUILT_DIR/sudoku.app"
          fi
          # 2) 兜底: 搜索 DerivedData
          if [ -z "$APP_PATH" ]; then
            echo "[WARN] showBuildSettings 未定位到,搜索 DerivedData..."
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "sudoku.app" -type d -maxdepth 8 2>/dev/null | head -1)
          fi
          # 3) 最后兜底: 搜索项目目录
          if [ -z "$APP_PATH" ]; then
            echo "[WARN] DerivedData 也未找到,搜索项目目录..."
            APP_PATH=$(find sudoku-ios -name "sudoku.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 sudoku.app 产物,请下载 build-log artifact 查看详细报错"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found: $APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          cd "$STAGE"
          # 用 -0 (store, 不压缩) 避免 iOS 对 IPA 内文件压缩的限制问题
          zip -qry "${{ github.workspace }}/sudoku-unsigned.ipa" Payload
          cd "${{ github.workspace }}"
          ls -lh sudoku-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-unsigned-ipa
          path: sudoku-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: sudoku-ios/build.log
          retention-days: 7
          if-no-files-found: ignore

